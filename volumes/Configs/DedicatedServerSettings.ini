////////////////////////////////////////////////////
////////////////////////////////////////////////////
// keywords - please don't edit this part of file //
////////////////////////////////////////////////////
////////////////////////////////////////////////////

!Map(s, s)                      // map name, game mode name
                                // map's name are: "Adobes" (for Taos Pueblo in the game), "Civil" (Burnside's Bridge), "Coffeyville" (Coffeyville), "Frisco" (Frisco), "Magnificent" (Magnificent), "PrisonBreak2" (Nogales), "StinkingSprings2" (Stinking Springs), "Tombstone" (Tombstone)
                                // game's mode are: "historical" (for Wild West Legends in the game), "teamwanted" (Manhunt), "wanted" (Wanted), "deathmatch" (Shootout), "teamdeathmatch" (Posse)

                            
!InternetServer(i)              // 1 means internet server, 0 means LAN server


!PublicSlots(i)                 // number of public slots (max players), 12 by default
!PlayersToStart(i)              // minimum number of players for the game to begin, 1 by default


//common params for all game modes ("teamwanted" / "wanted" / "deathmatch" / "teamdeathmatch"); params for "historical" can't be changed
!PointsLimitDefault(i)          // target number of points for the game to end (for "teamwanted" only)
!BountyLimitDefault(i)          // target of bounty for the game to end (for "wanted", "deathmatch", "teamdeathmatch" only)
!TimeLimitDefault(i)            // map time limit in seconds (for "teamwanted", "wanted", "deathmatch", "teamdeathmatch" only)


//specific game mode params for ("teamwanted" / "wanted" / "deathmatch" / "teamdeathmatch"); params for "historical" can't be changed; those keywords should be defined ater PointsLimitDefault()/BountyLimitDefault(), TimeLimitDefault() keywords!
!PointsLimit(s, i)              // target number of points for the game to end in game mode s (for "teamwanted" only)
!BountyLimit(s, i)              // target of bounty for the game to end in game modes (for "wanted", "deathmatch", "teamdeathmatch" only)
!TimeLimit(s, i)                // map time limit in seconds in game mode s (for "teamwanted", "wanted", "deathmatch", "teamdeathmatch" only)


!FriendlyFire(i)                // 1 = friendly fire is on 0 = friendly fire is off


!ServerName(s)                  // server name visible on the server list
!ServerPassword(s)              // password for starting the server - should be defined to prevent other servers from using the same name
!ServerPort(i)                  // port the server is running on


