services:
  coj2-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: final

    container_name: coj2-server
    restart: unless-stopped

    ports:
      - "6900:6900"
      - "27632:27632/udp"
      - "27632:27632/tcp"

    environment:
      - DISPLAY=:99
      - WINEPREFIX=/root/wine-coj2
      - WINEARCH=win32
      - WINEDEBUG=-all
      - VNC_PORT=6900
      - COJ_PORT=27632
      - RESOLUTION=1280x1024x24
      - VNC_PASS=${VNC_PASS:-}
      - AUTO_START=${AUTO_START:-false}

    volumes:
      - ./volumes/CustomMaps:/root/wine-coj2/drive_c/Program Files/Techland/Call of Juarez - Bound in Blood Dedicated Server/CoJ2/Data/MapsNet

      # Logs — always handy to have on the host
      - ./volumes/logs:/var/log

    shm_size: "256mb"
    cap_add:
      - SYS_PTRACE

    healthcheck:
      test: ["CMD-SHELL", "pgrep x11vnc > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s