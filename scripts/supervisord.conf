; ================================================================
; supervisord.conf – optional process manager inside the container
; Not used by default (entrypoint.sh handles startup directly).
; Useful if you want supervisor to restart crashed processes.
; ================================================================
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -ac -screen 0 1280x1024x24
autostart=true
autorestart=true
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":99",WINEPREFIX="/root/wine-coj2"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/fluxbox.log
stderr_logfile=/var/log/fluxbox.err

[program:x11vnc]
command=x11vnc -display :99.0 -forever -rfbport 6900 -nopw -noxrecord -noxfixes -noxdamage
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.err
